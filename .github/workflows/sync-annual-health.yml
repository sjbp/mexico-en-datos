name: Monthly Health Data Sync (Mortality, CLUES, life expectancy, ENSANUT)

on:
  schedule:
    # 15th of every month. Mortality microdata for a year is published at an
    # unpredictable point the following year, so we check monthly and pick it
    # up (and any revisions) as soon as it appears.
    - cron: '0 16 15 * *'
  workflow_dispatch:
    inputs:
      mortality_year:
        description: 'Mortality year to process (e.g., 2024). Leave empty for the last two years.'
        required: false
        type: string

jobs:
  sync-health:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Process mortality data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_YEAR: ${{ inputs.mortality_year }}
        run: |
          if [ -n "$INPUT_YEAR" ]; then
            YEARS="$INPUT_YEAR"
          else
            # Last year is often not published yet; the year before picks up revisions
            Y=$(date +%Y)
            YEARS="$((Y - 2)) $((Y - 1))"
          fi
          for YEAR in $YEARS; do
            uv run python -m ingest.pipelines.health.mortality --year "$YEAR" \
              || echo "::warning::Mortality $YEAR not processed. It may not be published yet; will retry next month."
          done

      - name: Refresh life expectancy (CONAPO via INEGI)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m ingest.pipelines.health.life_expectancy

      - name: Refresh ENSANUT (diagnosed diabetes and hypertension)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Processes every published survey year; new years are picked up automatically
        run: uv run python -m ingest.pipelines.health.ensanut --all

      - name: Refresh CLUES facility catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m ingest.pipelines.health.clues

      - name: Validate data integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m ingest.validate

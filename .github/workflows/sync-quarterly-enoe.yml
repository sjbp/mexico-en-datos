name: Quarterly ENOE Employment Microdata

on:
  schedule:
    # 15th of every month at 10:00 AM CDMX (16:00 UTC). INEGI publishes each
    # quarter ~6-8 weeks after it ends, on a date that varies. Checking monthly
    # picks it up within weeks; months with nothing new exit quickly.
    - cron: '0 16 15 * *'
  workflow_dispatch:
    inputs:
      quarter:
        description: 'Quarter to process (e.g., 2025Q2). Leave empty to process any missing recent quarter.'
        required: false
        type: string

jobs:
  sync-enoe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Find quarters to process
        id: quarters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_QUARTER: ${{ inputs.quarter }}
        run: |
          if [ -n "$INPUT_QUARTER" ]; then
            LIST="$INPUT_QUARTER"
          else
            # The last 4 completed quarters that are not in the DB yet
            LIST=$(uv run python3 -c "
          import os, psycopg2
          from datetime import date
          today = date.today()
          y, q = today.year, (today.month - 1) // 3 + 1
          candidates = []
          for _ in range(4):
              y, q = (y, q - 1) if q > 1 else (y - 1, 4)
              candidates.append(f'{y}Q{q}')
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute('SELECT DISTINCT quarter FROM employment_stats')
          have = {r[0].replace('/', '') for r in cur.fetchall()}
          conn.close()
          print(' '.join(sorted(c for c in candidates if c not in have)))
          ")
          fi
          echo "Quarters to process: ${LIST:-none}"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Download and process ENOE
        if: steps.quarters.outputs.list != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QUARTERS: ${{ steps.quarters.outputs.list }}
        run: |
          mkdir -p data/enoe
          for QUARTER in $QUARTERS; do
            echo "Processing ENOE $QUARTER"
            uv run python -m ingest.pipelines.enoe --quarter "$QUARTER" --data-dir data/enoe \
              || echo "::warning::ENOE $QUARTER not processed. It may not be published yet; will retry next month."
          done

      - name: Report results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python3 -c "
          import psycopg2, os
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute('SELECT quarter, COUNT(*) FROM employment_stats GROUP BY quarter ORDER BY quarter')
          print('Employment stats by quarter:')
          for r in cur.fetchall(): print(f'  {r[0]}: {r[1]} rows')
          conn.close()
          "

      - name: Validate data integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m ingest.validate

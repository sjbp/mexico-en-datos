name: Daily Data Sync (Banxico + INEGI)

on:
  schedule:
    # 6:00 AM Mexico City (UTC-6) = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Sync Banxico (inflation, tipo de cambio, tasa objetivo)
        env:
          BANXICO_API_TOKEN: ${{ secrets.BANXICO_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m ingest.pipelines.banxico

      - name: Sync INEGI indicators (PIB, IGAE, employment, trade, confidence)
        env:
          INEGI_API_TOKEN: ${{ secrets.INEGI_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m ingest.pipelines.indicators

      - name: Validate data integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m ingest.validate

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. Re-enabling them through the API resets that timer, so the
    # syncs keep running even when nobody pushes to the repo.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in sync-daily.yml sync-monthly.yml sync-quarterly-enoe.yml sync-annual-health.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "Enabled $wf"
          done

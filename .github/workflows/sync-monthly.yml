name: Weekly Data Sync (SESNSP Homicides)

on:
  schedule:
    # Mondays at 8:00 AM Mexico City (14:00 UTC). SESNSP publishes around
    # the 20th of each month; a weekly run picks it up within a few days.
    - cron: '0 14 * * 1'
  workflow_dispatch: # Manual trigger

jobs:
  sync-sesnsp:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Download SESNSP data
        run: |
          mkdir -p data/sesnsp
          BASE="https://raw.githubusercontent.com/lapanquecita/incidencia-delictiva/main/data"
          # estatal.csv: 2015-2025 (old methodology)
          # estatal_n.csv: 2026+ (new methodology, published separately)
          curl -fsSL -o data/sesnsp/estatal.csv "$BASE/estatal.csv"
          curl -fsSL -o data/sesnsp/estatal_n.csv "$BASE/estatal_n.csv"

      - name: Process SESNSP homicide data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m ingest.pipelines.sesnsp --csv-path data/sesnsp/estatal.csv --full
          uv run python -m ingest.pipelines.sesnsp --csv-path data/sesnsp/estatal_n.csv --full

      - name: Validate data integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m ingest.validate
